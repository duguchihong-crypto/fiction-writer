<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <meta name="theme-color" content="#9f3028">
<title>文墨 · 小说写作</title>
<!-- 全局样式 -->
<link rel="stylesheet" href="css/common.css">
<!-- 顶部导航模块 -->
<link rel="stylesheet" href="css/header/header.css">
<!-- 书架模块 -->
<link rel="stylesheet" href="css/shelf/shelf.css">
<link rel="stylesheet" href="css/shelf/book.css">
<link rel="stylesheet" href="css/shelf/group.css">
<!-- 工具模块 -->
<link rel="stylesheet" href="css/tools/tools.css">
<!-- 底部导航模块 -->
<link rel="stylesheet" href="css/footer/footer.css">
<!-- 弹窗模块 -->
<link rel="stylesheet" href="css/modal/modal.css">
</head>
<body>
<div class="app">
<!-- ==========================================
     顶部导航模块
=========================================== -->
<header class="header" id="header-module">
    <div class="brand">
        <span class="brand-symbol">文</span>
        <span>文墨</span>
    </div>
    <div class="header-actions">
        <button
            class="header-btn btn-create"
            id="create-btn"
            type="button"
        >
            <span>＋</span>
            <span>新建</span>
        </button>
        <button
            class="header-btn btn-settings"
            id="settings-btn"
            type="button"
        >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
            >
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 8.4 15a1.7 1.7 0 0 0-1.56-1.03H6v-2.4h.2a1.7 1.7 0 0 0 1.56-1.03 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06A1.7 1.7 0 0 0 11 7.3a1.7 1.7 0 0 0 1.03-1.56V5h2.4v.2a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 18.7 10a1.7 1.7 0 0 0 1.56 1.03h.2v2.4h-.2A1.7 1.7 0 0 0 19.4 15Z"></path>
            </svg>
            <span>设置</span>
        </button>
    </div>
</header>
<!-- ==========================================
     页面主体
=========================================== -->
<main class="main" id="main-content">
    <!-- ======================================
         书架模块
    ======================================= -->
    <section
        class="shelf-module"
        id="shelf-page"
        data-module="shelf"
    >
        <!-- 书架标题 -->
        <div class="section-title">
            <span>我的书架</span>
        </div>
        <!-- 空书架状态 -->
        <div
            class="empty-state"
            id="empty-state"
        >
            <h2 class="empty-title">
                卷帙未启
            </h2>
            <div class="empty-divider">
                <span class="diamond left"></span>
                <span class="diamond right"></span>
            </div>
            <div class="empty-diamond">
                ◆
            </div>
            <p class="empty-subtitle">
                书架尚空，静候新篇。
            </p>
            <p class="empty-description">
                此间尚无作品，不妨挥毫落墨，<br>
                写下你的第一个故事。
            </p>
        </div>
        <!-- ==================================
             书籍模块
        =================================== -->
        <section
            class="content-section"
            id="books-section"
            data-module="books"
            hidden
        >
            <div class="content-section-header">
                <span class="content-section-name">
                    藏书
                </span>
                <span
                    class="content-section-count"
                    id="book-count"
                >
                    0 本
                </span>
            </div>
            <div
                class="book-grid"
                id="book-grid"
            ></div>
        </section>
        <!-- ==================================
             书籍组合模块
        =================================== -->
        <section
            class="content-section"
            id="groups-section"
            data-module="groups"
            hidden
        >
            <div class="content-section-header">
                <span class="content-section-name">
                    书籍组合
                </span>
                <span
                    class="content-section-count"
                    id="group-count"
                >
                    0 组
                </span>
            </div>
            <div
                class="group-list"
                id="group-list"
            ></div>
        </section>
    </section>
    <!-- ======================================
         工具模块
    ======================================= -->
    <section
        class="tools-page"
        id="tools-page"
        data-module="tools"
        hidden
    >
        <div class="section-title">
            <span>创作工具</span>
        </div>
        <p class="tools-intro">
            辅助创作，整理思绪。<br>
            让每一个故事都有迹可循。
        </p>
        <div class="tools-grid">
            <button
                class="tool-card"
                id="tool-character"
                type="button"
            >
                <span class="tool-icon">✒</span>
                <span class="tool-name">人物设定</span>
            </button>
            <button
                class="tool-card"
                id="tool-world"
                type="button"
            >
                <span class="tool-icon">山</span>
                <span class="tool-name">世界观</span>
            </button>
            <button
                class="tool-card"
                id="tool-relation"
                type="button"
            >
                <span class="tool-icon">∞</span>
                <span class="tool-name">关系图谱</span>
            </button>
            <button
                class="tool-card"
                id="tool-timeline"
                type="button"
            >
                <span class="tool-icon">历</span>
                <span class="tool-name">时间线</span>
            </button>
        </div>
    </section>
</main>
<!-- ==========================================
     底部导航模块
=========================================== -->
<footer class="footer" id="footer-module">
    <button
        class="nav-item active"
        id="nav-shelf"
        type="button"
        data-page="shelf"
    >
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
        >
            <path d="M3 5.5 12 2l9 3.5v13L12 22l-9-3.5z"></path>
            <path d="M3 5.5 12 9l9-3.5"></path>
            <path d="M12 9v13"></path>
        </svg>
        <span>书架</span>
    </button>
    <button
        class="nav-item"
        id="nav-tools"
        type="button"
        data-page="tools"
    >
        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
        >
            <path d="M4 4h16v16H4z"></path>
            <path d="M8 8h8M8 12h8M8 16h5"></path>
        </svg>
        <span>工具</span>
    </button>
</footer>
</div>
<!-- ==============================================
     弹窗模块
=============================================== -->
<!-- 新建选择弹窗 -->
<div
    class="modal"
    id="create-modal"
    data-module="create-modal"
    hidden
>
<div
    class="modal-backdrop"
    data-close="create-modal"
></div>
<div class="modal-panel">
    <h2 class="modal-title">
        创建新内容
    </h2>
    <div class="modal-options">
        <button
            class="modal-option"
            id="new-book-btn"
            type="button"
        >
            <span class="modal-option-icon">
                书
            </span>
            <span>
                <span class="modal-option-text">
                    新建书籍
                </span>
                <span class="modal-option-desc">
                    开启一个新的故事
                </span>
            </span>
        </button>
        <button
            class="modal-option"
            id="new-group-btn"
            type="button"
        >
            <span class="modal-option-icon">
                册
            </span>
            <span>
                <span class="modal-option-text">
                    新建组合
                </span>
                <span class="modal-option-desc">
                    将相关书籍整理在一起
                </span>
            </span>
        </button>
    </div>
    <button
        class="modal-close"
        data-close="create-modal"
        type="button"
    >
        关闭
    </button>
</div>
</div>
<!-- 设置弹窗 -->
<div
    class="modal"
    id="settings-modal"
    data-module="settings-modal"
    hidden
>
<div
    class="modal-backdrop"
    data-close="settings-modal"
></div>
<div class="modal-panel">
    <h2 class="modal-title">
        书架设置
    </h2>
    <div class="setting-row">
        <span>显示方式</span>
        <div class="setting-buttons">
            <button
                class="setting-btn selected"
                id="grid-mode-btn"
                type="button"
            >
                网格
            </button>
            <button
                class="setting-btn"
                id="list-mode-btn"
                type="button"
            >
                列表
            </button>
        </div>
    </div>
    <div class="setting-row">
        <span>排序方式</span>
        <div class="setting-buttons">
            <button
                class="setting-btn selected"
                id="sort-new-btn"
                type="button"
            >
                最新
            </button>
            <button
                class="setting-btn"
                id="sort-name-btn"
                type="button"
            >
                名称
            </button>
        </div>
    </div>
    <button
        class="modal-close"
        data-close="settings-modal"
        type="button"
    >
        关闭
    </button>
</div>
</div>
<!-- 新建书籍弹窗 -->
<div
    class="modal"
    id="book-modal"
    data-module="book-modal"
    hidden
>
<div
    class="modal-backdrop"
    data-close="book-modal"
></div>
<div class="modal-panel">
    <h2 class="modal-title">
        新建书籍
    </h2>
    <label
        class="input-label"
        for="book-name-input"
    >
        请输入书籍名称
    </label>
    <input
        class="text-input"
        id="book-name-input"
        type="text"
        maxlength="40"
        placeholder="请输入书名"
    >
    <div class="form-actions">
        <button
            class="form-btn"
            data-close="book-modal"
            type="button"
        >
            取消
        </button>
        <button
            class="form-btn primary"
            id="confirm-book-btn"
            type="button"
        >
            创建
        </button>
    </div>
</div>
</div>
<!-- 新建组合弹窗 -->
<div
    class="modal"
    id="group-modal"
    data-module="group-modal"
    hidden
>
<div
    class="modal-backdrop"
    data-close="group-modal"
></div>
<div class="modal-panel">
    <h2 class="modal-title">
        新建组合
    </h2>
    <label
        class="input-label"
        for="group-name-input"
    >
        请输入组合名称
    </label>
    <input
        class="text-input"
        id="group-name-input"
        type="text"
        maxlength="40"
        placeholder="例如：玄幻系列"
    >
    <div class="form-actions">
        <button
            class="form-btn"
            data-close="group-modal"
            type="button"
        >
            取消
        </button>
        <button
            class="form-btn primary"
            id="confirm-group-btn"
            type="button"
        >
            创建
        </button>
    </div>
</div>
</div>
<!-- ==============================================
     JavaScript 模块入口
=============================================== -->
<script type="module" src="js/app.js"></script>
</body>
</html>
